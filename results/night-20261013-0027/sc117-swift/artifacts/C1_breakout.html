<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブロック崩し</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #222;
    color: #eee;
    font-family: sans-serif;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: #111;
    display: block;
    margin-top: 10px;
  }
  #hud {
    width: 480px;
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="scoreText">SCORE: 0</span>
    <span id="livesText">LIVES: 3</span>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreText = document.getElementById('scoreText');
  var livesText = document.getElementById('livesText');

  var W = canvas.width;
  var H = canvas.height;

  // 設定
  var PADDLE_W = 80;
  var PADDLE_H = 12;
  var PADDLE_SPEED = 6;
  var BALL_R = 7;
  var BALL_SPEED = 4;
  var BALL_SPEED_Y = 3.5;
  var ROWS = 5;
  var COLS = 8;
  var BLOCK_W = 50;
  var BLOCK_H = 20;
  var BLOCK_TOP = 50;
  var BLOCK_LEFT = (W - COLS * BLOCK_W) / 2; // 0
  var MAX_LIVES = 3;

  // 状態
  var paddle, ball, bricks, keys, score, lives, state;

  window.gameState = { score: 0, lives: MAX_LIVES, state: 'ready' };

  function resetGame() {
    score = 0;
    lives = MAX_LIVES;
    state = 'ready';
    paddle = { x: W / 2 - PADDLE_W / 2, y: H - 40, w: PADDLE_W };
    ball = { x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    bricks = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({
          x: BLOCK_LEFT + c * BLOCK_W,
          y: BLOCK_TOP + r * BLOCK_H,
          alive: true,
          color: 'hsl(' + (200 + r * 25) + ', 80%, 55%)'
        });
      }
    }
    keys = { left: false, right: false };
    syncGameState();
  }

  function syncGameState() {
    window.gameState.score = score;
    window.gameState.lives = lives;
    window.gameState.state = state;
    window.gameState.ball = { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy };
    window.gameState.paddle = { x: paddle.x, y: paddle.y, w: paddle.w };
  }

  function launchBall() {
    if (state !== 'playing' && state !== 'ready') return;
    if (!ball.stuck) return;
    state = 'playing';
    ball.stuck = false;
    ball.vx = (Math.random() * 2 - 1) * 2;
    if (Math.abs(ball.vx) < 0.5) ball.vx = 1;
    ball.vy = -BALL_SPEED_Y;
    // 速度を正規化して一定速度に
    var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    ball.vx = ball.vx / sp * BALL_SPEED;
    ball.vy = ball.vy / sp * BALL_SPEED;
    syncGameState();
  }

  // 入力
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      launchBall();
    }
    if (e.key === 'r' || e.key === 'R') {
      resetGame();
    }
  });

  function normalizeBallSpeed() {
    var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (sp > 0) {
      ball.vx = ball.vx / sp * BALL_SPEED;
      ball.vy = ball.vy / sp * BALL_SPEED;
    }
  }

  function circleRectHit(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx;
    var dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function update() {
    if (state === 'gameover' || state === 'clear') return;

    // パドル移動
    if (keys.left) paddle.x -= PADDLE_SPEED;
    if (keys.right) paddle.x += PADDLE_SPEED;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > W) paddle.x = W - paddle.w;

    if (ball.stuck) {
      // パドルに乗っている
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - BALL_R - 1;
      syncGameState();
      return;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // 壁反射
    if (ball.x - BALL_R < 0) {
      ball.x = BALL_R;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x + BALL_R > W) {
      ball.x = W - BALL_R;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y - BALL_R < 0) {
      ball.y = BALL_R;
      ball.vy = Math.abs(ball.vy);
    }

    // パドル反射
    if (ball.vy > 0 && circleRectHit(ball.x, ball.y, BALL_R, paddle.x, paddle.y, paddle.w, PADDLE_H)) {
      ball.y = paddle.y - BALL_R;
      // 当たった位置で角度を変える
      var hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      var angle = hitPos * (Math.PI / 3); // 最大60度
      ball.vx = BALL_SPEED * Math.sin(angle);
      ball.vy = -BALL_SPEED * Math.cos(angle);
      normalizeBallSpeed();
    }

    // ブロック反射
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (circleRectHit(ball.x, ball.y, BALL_R, b.x, b.y, BLOCK_W, BLOCK_H)) {
        b.alive = false;
        score += 10;
        // どの面から当たったかで反射方向を決める
        var prevX = ball.x - ball.vx;
        var prevY = ball.y - ball.vy;
        if (prevY <= b.y) { ball.vy = -Math.abs(ball.vy); }
        else if (prevY >= b.y + BLOCK_H) { ball.vy = Math.abs(ball.vy); }
        else if (prevX <= b.x) { ball.vx = -Math.abs(ball.vx); }
        else if (prevX >= b.x + BLOCK_W) { ball.vx = Math.abs(ball.vx); }
        else { ball.vy = -ball.vy; }
        break;
      }
    }

    // 全ブロック破壊 -> クリア
    var allBroken = true;
    for (var j = 0; j < bricks.length; j++) {
      if (bricks[j].alive) { allBroken = false; break; }
    }
    if (allBroken) {
      state = 'clear';
      syncGameState();
      return;
    }

    // 下に落ちる
    if (ball.y - BALL_R > H) {
      lives -= 1;
      if (lives <= 0) {
        lives = 0;
        state = 'gameover';
        syncGameState();
        return;
      }
      // ボールをパドルに戻す
      ball.stuck = true;
      ball.vx = 0;
      ball.vy = 0;
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - BALL_R - 1;
    }

    syncGameState();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // ブロック
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, BLOCK_W - 2, BLOCK_H - 2);
    }

    // パドル
    ctx.fillStyle = '#eee';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, PADDLE_H);

    // ボール
    ctx.fillStyle = '#ffd24d';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();

    // 状態メッセージ
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    if (state === 'ready') {
      ctx.fillText('スペースキーで発射！', W / 2, H / 2 + 60);
    } else if (state === 'gameover') {
      ctx.fillText('GAME OVER', W / 2, H / 2);
    } else if (state === 'clear') {
      ctx.fillText('CLEAR!', W / 2, H / 2);
    }
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#999';
    ctx.fillText('Rキーでリセット', W / 2, H - 8);

    scoreText.textContent = 'SCORE: ' + score;
    livesText.textContent = 'LIVES: ' + lives;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
